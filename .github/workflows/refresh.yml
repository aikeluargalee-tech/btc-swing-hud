name: refresh
on:
  schedule: [{ cron: "7,22,37,52 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run refresh
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python scripts/refresh.py
      - name: Commit if changed
        run: |
          git config user.name "hud-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hud.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: refresh $(date -u +%FT%TZ)"
          git pull --rebase -X theirs origin main || true
          git push
