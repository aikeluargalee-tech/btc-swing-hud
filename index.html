<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d10"><title>BTC Swing HUD</title><link rel="stylesheet" href="style.css?v=1793603822"></head>
<body><main>
<header><h1>BTC SWING HUD</h1><span class="mut"><span id="dot" class="dot"></span><span id="feed">connecting…</span></span></header>
<section class="card verdict" id="verdict"></section>
<section class="card"><h2>Triggers</h2><div id="triggers"></div><p class="mut" id="trigNote"></p></section>
<section class="card"><h2>Price</h2><div class="seg" id="seg"><button data-v="48h" class="on">48h</button><button data-v="30d">30d</button></div><div id="chart"></div></section>
<section class="card"><h2>Positioning</h2><dl class="kv" id="pos"></dl></section>
<section class="card"><h2>Sentiment</h2><dl class="kv" id="sent"></dl></section>
<section class="card"><h2>Events (MYT)</h2><div id="events"></div></section>
<section class="card"><h2>Sessions (MYT) · <span id="clock"></span></h2><div id="sessions"></div></section>
<section class="card"><h2>Macro</h2><dl class="kv" id="macro"></dl></section>
<section class="card"><h2>Bot verdicts</h2><div class="seg" id="bseg"><button data-v="has" class="on">Has verdict</button><button data-v="all">All 21</button></div><div id="bots"></div></section>
<section class="card"><details><summary>Data gaps</summary><p class="mut" id="gaps"></p></details></section>
<p class="mut" id="foot"></p>
</main><script src="app.js?v=1793603822"></script></body></html>
